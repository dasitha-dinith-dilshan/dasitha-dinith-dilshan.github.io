<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Dinith Dilshan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">DINITH<span>DILSHAN</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="portfolio.html" class="active">Portfolio</a>
            <a href="contact.html">Contact</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </nav>
    </header>

    <div class="portfolio-header">
        <h1>Selected Projects</h1>
        <p>Showcasing creativity across branding, design, and digital media</p>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all"><span>All Projects</span></button>
            <button class="filter-btn" data-filter="branding"><span>Branding</span></button>
            <button class="filter-btn" data-filter="social"><span>Social Media</span></button>
            <button class="filter-btn" data-filter="video"><span>Videos</span></button>
            <button class="filter-btn" data-filter="art"><span>Fine Arts</span></button>
        </div>
    </div>

    <div class="portfolio-grid" id="portfolioGrid"></div>

    <footer>
        <div class="footer-content">
            <h2>Let's create something amazing.</h2>
            <p>Available for freelance projects and collaborations.</p>
            <div class="social-links">
                <a href="#" target="_blank">Behance</a>
                <a href="#" target="_blank">Instagram</a>
                <a href="#" target="_blank">LinkedIn</a>
            </div>
            <a href="contact.html" class="btn">Get In Touch</a>
            <p style="margin-top: 60px; color: #555; font-size: 0.85rem;">&copy; 2026 Dinith Dilshan. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');

        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const theme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
        });

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        /* ============================================
           🎨 මෙහි ඔබේ PROJECTS ADD කරන්න
           ============================================

           📝 Format types:

           1) Single image:
           { type: "image", media: "file.jpg" }

           2) Multiple images (slider):
           { type: "image", media: ["a.jpg", "b.jpg", "c.jpg"] }

           3) Single video:
           { type: "video", media: "file.mp4", thumbnail: "thumb.jpg" }

           4) Mixed images + videos (slider):
           { type: "mixed", media: [
               { type: "image", src: "a.jpg" },
               { type: "video", src: "file.mp4", thumbnail: "thumb.jpg" }
           ]}
        */

        const myProjects = [
            {
                title: "Custom Logo Design for Maxwell Engineering",
                category: "branding",
                description: "Designed a professional logo for Maxwell Engineering using client-provided text and reference samples. The design follows a clean, modern style with a strong red and blue color combination to represent trust, strength, and engineering excellence.",
                type: "image",
                media: "projects/Branding_Maxwell.jpg",
                date: "June 2025"
            },
            {
                title: "Business cards for Maxwell Engineering",
                category: "branding",
                description: "Designed professional business cards for Maxwell Engineering, using a clean layout and brand-consistent colors for a modern and corporate look.",
                type: "image",
                media: "projects/Branding_BusinessCard.jpg",
                date: "July 2025"
            },
            {
                title: "Video Advertisement for Gamma Construction Company",
                category: "video",
                description: "Created a promotional video advertisement for Gamma Construction Company using engaging text and simple animations. A professional dubbing artist was used for the voice-over, which was enhanced using Adobe Podcast for improved audio clarity. The video was edited and finalized using Adobe Premiere Pro 2023 to deliver a clear and professional message.",
                type: "video",
                media: "projects/Video_GammaAD.mp4",
                thumbnail: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=800",
                date: "September 2025"
            },
            {
                title: "Company Profile Design for Maxwell Engineering",
                category: "branding",
                description: "Designed a professional company profile for Maxwell Engineering, including detailed company information. The layout follows a clean and modern design style to clearly present the company's services, strengths, and identity.",
                type: "image",
                media: "projects/Branding_Maxwell_Profile.jpg",
                date: "August 2025"
            },
            {
                title: "Product Launch Campaign",
                category: "social",
                description: "Eye-catching social media design series for new product announcement.",
                type: "image",
                media: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=800"
            },
            {
                title: "Book Cover Design for ICT Class",
                category: "art",
                description: "Designed a creative and professional book cover for an ICT class conducted by Ms. Nadeeka Fernando. The design focuses on a clean layout and visually appealing elements suitable for educational content.",
                type: "image",
                media: "projects/Art_ICTNadeeka.jpg",
                date: "May 2024"
            },
            {
                title: "Video Advertisement for ICT Class",
                category: "video",
                description: "Created a video advertisement for an ICT class conducted by Mr. Dilanaka Sandeepa using simple animations, text, and images. A professional dubbing artist was used for the voice-over, which was enhanced using Adobe Podcast. The video was edited and finalized using Adobe Premiere Pro 2023.",
                type: "video",
                media: "projects/Video_Dilanka ICT.mp4",
                thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800",
                date: "December 2025"
            },
            {
                title: "Facebook Post Design for Gamma Construction",
                category: "social",
                description: "Designed a creative and engaging Facebook post for Gamma Construction to promote their services. The design focuses on a clean layout and strong visual appeal suitable for social media marketing.",
                type: "image",
                media: ["projects/SM_00015.jpg", "projects/G007.jpg", "projects/G008.jpg"]
            },
            {
                title: "Small Video Advertisement for Gamma Construction",
                category: "video",
                description: "Created a short promotional video advertisement for Gamma Construction using Adobe Premiere Pro 2023. The video focuses on promoting new house construction services with a clear and simple message.",
                type: "video",
                media: "projects/Video_gammav1.mp4",
                thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800",
                date: "June 2025"
            },
            {
                // EXAMPLE: Mixed images + video in one slider
                title: "Testing Mixed Slider",
                category: "branding",
                description: "Testing mixed image and video slider.",
                type: "mixed",
                media: [
                    { type: "image", src: "projects/Branding_Maxwell.jpg" },
                    { type: "image", src: "projects/Branding_Maxwell_Profile.jpg" },
                    { type: "video", src: "projects/Video_gammav1.mp4", thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800" }
                ],
                date: "June 2025"
            },
        ];

        // DOM Elements
        const grid = document.getElementById('portfolioGrid');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Display Projects Function
        function displayProjects(filterType = 'all') {
            grid.innerHTML = "";

            const filtered = filterType === 'all'
                ? myProjects
                : myProjects.filter(p => p.category === filterType);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                        <h3>No projects yet</h3>
                        <p>Projects in this category are coming soon!</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((project, index) => {
                const item = document.createElement('div');
                item.className = 'portfolio-item';
                item.style.animationDelay = `${index * 0.1}s`;

                let mediaHTML = '';

                // ── MIXED: images and/or videos in one slider ──
                if (project.type === 'mixed') {
                    const slides = project.media.map((mediaItem, i) => {
                        if (mediaItem.type === 'video') {
                            return `
                                <div class="slide slide-video-wrapper ${i === 0 ? 'active' : ''}">
                                    <img src="${mediaItem.thumbnail}" alt="${project.title}" class="video-thumbnail">
                                    <video src="${mediaItem.src}" loop playsinline class="project-video"></video>
                                    <div class="play-icon">&#9654;</div>
                                    <div class="video-controls"><button class="pause-btn">&#9208; Pause</button></div>
                                </div>
                            `;
                        } else {
                            return `<img src="${mediaItem.src}" alt="${project.title}" class="slide ${i === 0 ? 'active' : ''}">`;
                        }
                    }).join('');

                    const dots = project.media.map((mediaItem, i) => `
                        <span class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(this, ${i})">
                            ${mediaItem.type === 'video' ? '<i class="fas fa-play" style="font-size:6px;pointer-events:none;"></i>' : ''}
                        </span>
                    `).join('');

                    mediaHTML = `
                        <div class="slider-wrapper">
                            ${slides}
                            <button class="slider-btn prev" onclick="slideProject(this, -1)">&#8249;</button>
                            <button class="slider-btn next" onclick="slideProject(this, 1)">&#8250;</button>
                            <div class="slider-dots">${dots}</div>
                        </div>
                    `;

                // ── SINGLE VIDEO ──
                } else if (project.type === 'video') {
                    mediaHTML = `
                        <img src="${project.thumbnail}" alt="${project.title}" class="video-thumbnail">
                        <video src="${project.media}" loop playsinline class="project-video"></video>
                        <div class="play-icon">&#9654;</div>
                        <div class="video-controls"><button class="pause-btn">&#9208; Pause</button></div>
                    `;

                // ── IMAGE or IMAGE SLIDER ──
                } else {
                    const images = Array.isArray(project.media) ? project.media : [project.media];
                    if (images.length > 1) {
                        const slides = images.map((src, i) =>
                            `<img src="${src}" alt="${project.title}" class="slide ${i === 0 ? 'active' : ''}">`
                        ).join('');
                        mediaHTML = `
                            <div class="slider-wrapper">
                                ${slides}
                                <button class="slider-btn prev" onclick="slideProject(this, -1)">&#8249;</button>
                                <button class="slider-btn next" onclick="slideProject(this, 1)">&#8250;</button>
                                <div class="slider-dots">
                                    ${images.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(this, ${i})"></span>`).join('')}
                                </div>
                            </div>
                        `;
                    } else {
                        mediaHTML = `<img src="${images[0]}" alt="${project.title}">`;
                    }
                }

                // Date badge
                const dateBadge = project.date
                    ? `<span class="project-date"><i class="far fa-calendar"></i> ${project.date}</span>`
                    : '';

                item.innerHTML = `
                    ${mediaHTML}
                    ${dateBadge}
                    <div class="overlay">
                        <h3>${project.title}</h3>
                        <span class="category-tag">${project.category}</span>
                        <p class="description">${project.description}</p>
                    </div>
                `;

                // ── Video play/pause for single video ──
                if (project.type === 'video') {
                    const video = item.querySelector('.project-video');
                    const playIcon = item.querySelector('.play-icon');
                    const pauseBtn = item.querySelector('.pause-btn');

                    playIcon.addEventListener('click', (e) => {
                        e.stopPropagation();
                        video.muted = false;
                        video.play();
                        item.classList.add('video-playing');
                    });

                    pauseBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        video.pause();
                        video.currentTime = 0;
                        item.classList.remove('video-playing');
                    });

                    video.addEventListener('ended', () => {
                        item.classList.remove('video-playing');
                    });
                }

                // ── Video play/pause for mixed slider videos ──
                if (project.type === 'mixed') {
                    item.querySelectorAll('.slide-video-wrapper').forEach(wrapper => {
                        const video = wrapper.querySelector('.project-video');
                        const playIcon = wrapper.querySelector('.play-icon');
                        const pauseBtn = wrapper.querySelector('.pause-btn');

                        playIcon.addEventListener('click', (e) => {
                            e.stopPropagation();
                            video.muted = false;
                            video.play();
                            wrapper.classList.add('video-playing');
                        });

                        pauseBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            video.pause();
                            video.currentTime = 0;
                            wrapper.classList.remove('video-playing');
                        });

                        video.addEventListener('ended', () => {
                            wrapper.classList.remove('video-playing');
                        });
                    });
                }

                // Click to filter by category
                item.addEventListener('click', function(e) {
                    e.stopPropagation();

                    this.classList.add('clicked');
                    setTimeout(() => this.classList.remove('clicked'), 600);

                    setTimeout(() => {
                        const categoryBtn = document.querySelector(`[data-filter="${project.category}"]`);
                        if (categoryBtn && project.category !== filterType) {
                            filterBtns.forEach(b => b.classList.remove('active'));
                            categoryBtn.classList.add('active');
                            displayProjects(project.category);
                            window.scrollTo({ top: 250, behavior: 'smooth' });
                        }
                    }, 300);
                });

                grid.appendChild(item);
            });
        }

        // Filter buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const category = this.getAttribute('data-filter');
                displayProjects(category);
                setTimeout(() => window.scrollTo({ top: 250, behavior: 'smooth' }), 100);
            });
        });

        // Slider: go forward or back
        function slideProject(btn, direction) {
            event.stopPropagation();
            const wrapper = btn.closest('.slider-wrapper');
            const slides = wrapper.querySelectorAll('.slide');
            const dots = wrapper.querySelectorAll('.dot');

            // Pause any playing video in this slider before switching
            const playingVideo = wrapper.querySelector('.slide-video-wrapper.video-playing .project-video');
            if (playingVideo) {
                playingVideo.pause();
                playingVideo.currentTime = 0;
                wrapper.querySelector('.slide-video-wrapper.video-playing').classList.remove('video-playing');
            }

            let current = [...slides].findIndex(s => s.classList.contains('active'));
            slides[current].classList.remove('active');
            dots[current].classList.remove('active');
            current = (current + direction + slides.length) % slides.length;
            slides[current].classList.add('active');
            dots[current].classList.add('active');
        }

        // Slider: jump to specific slide via dot
        function goToSlide(dot, index) {
            event.stopPropagation();
            const wrapper = dot.closest('.slider-wrapper');
            const slides = wrapper.querySelectorAll('.slide');
            const dots = wrapper.querySelectorAll('.dot');

            // Pause any playing video before switching
            const playingVideo = wrapper.querySelector('.slide-video-wrapper.video-playing .project-video');
            if (playingVideo) {
                playingVideo.pause();
                playingVideo.currentTime = 0;
                wrapper.querySelector('.slide-video-wrapper.video-playing').classList.remove('video-playing');
            }

            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[index].classList.add('active');
            dots[index].classList.add('active');
        }

        // Initialize
        displayProjects('all');
    </script>
</body>
</html>
